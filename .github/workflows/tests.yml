name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the test tool
        run: python -m pip install pytest
      - name: Check that no file changes how the tests run
        run: |
          found=$(find . -path ./.git -prune -o -type f \( -name conftest.py -o -name pytest.ini -o -name tox.ini -o -name setup.cfg -o -name sitecustomize.py -o -name usercustomize.py \) -print)
          if [ -n "$found" ]; then
            echo "These files change how pytest runs. Remove them:"
            echo "$found"
            exit 1
          fi
      # -c /dev/null and --noconftest make pytest ignore any test settings or
      # conftest.py files in the repository, so the nine tests run exactly as
      # they do in the template.
      - name: Run the attack tests and the useful tests
        run: python -m pytest -c /dev/null --rootdir . --noconftest -p no:cacheprovider tests/test_attacks.py tests/test_useful.py
